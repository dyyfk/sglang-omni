# SPDX-License-Identifier: Apache-2.0
# Note (Jiaxin Deng): the launcher owns replica count, so this dedicated file
# freezes the validated DP2 budget independently of future DP3 tuning.

config_cls: HiggsTtsPipelineConfig
name: higgs
model_path: bosonai/higgs-tts-3-4b

stage_overrides:
  tts_engine:
    runtime:
      sglang_server_args:
        mem_fraction_static: 0.85

runtime_overrides:
  tts_engine:
    server_args_overrides:
      max_total_tokens: 100000
      max_running_requests: 64
      cuda_graph_max_bs: 64
